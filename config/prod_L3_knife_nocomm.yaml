# REGISTERED COMMS-OFF-CONTROL — L3 x knife x nocomm (gegenereerd 2026-07-16 uit
# prod_L3_knife.yaml; enige delta: comm_scope). Falsifieerbare kern: geweld-onderdrukking
# + Sugden-prive-norm; institutie-contrast voorwaardelijk op bistabiliteit comms-aan-cel.
# REGISTERED PRODUCTIE-CEL — L3 x knife (gegenereerd 2026-07-16 uit frozen ladder_L3.yaml;
# enige delta: g_inv). Confirmatory grid: 4 rungen x 3 payoff-cellen. NIET wijzigen na deposit.
# Complexity ladder — RUNG 3: Association.
# Affordances: L2 + drop/invite (network rewiring). No commons.
# Comms + memory ON (always-on base substrate). Prod numeric params unchanged.
# rewiring_prob > 0 so association actually has bite (w=0.5).
#
# Flag matrix (see ladder_L1.yaml header).

num_agents: 30
initial_resources: 100.0

# Investment
c_inv: 0.06
g_inv: 0.091                         # REGISTERED payoff-cel: knife (triplet 0.039/0.091/0.142)
gamma_sat: 1.00
tau_sat: 5

# Arming — ON
arm_enabled: true
c_arm: 0.05
mu_arm: 4.0
delta_B: 0.75

# Combat — ON
take_enabled: true
alpha: 0.35
c_atk: 0.02
symmetric_stakes: true
lethal_pot: false

# Commons — OFF on L3
commons_enabled: false
commons_K: 120.0
commons_init: 120.0                   # dormant (commons_enabled false); parity met L4
commons_regen: 1.5                    # dormant (commons off); parity met L4
c_harvest: 0.03                       # dormant (commons off); parity met L4
harvest_frac_cap: 0.04                # dormant; parity met L4
commons_collapse_frac: 0.05
commons_open_round: 2                 # inert zolang commons_enabled false (parity met L4)

# Economy
delta_R: 0.97

# Game length
max_rounds: 60
history_length: 10

# Network — association (rewiring) ON from L3; w>0 gives it bite
network_enabled: true
assoc_enabled: true
mean_degree: 5.0
rewiring_prob: 1.0                    # actie = zekere uitkomst (productie, 2026-07-14)

# Communication — ON (base substrate)
comm_scope: "none"                    # REGISTERED comms-off-control (beslist 2026-07-16: beide op knife-edge)

# Memory — ON (base substrate)
memory:
  enabled: true
  window_size: 10
  notes_persist: true
