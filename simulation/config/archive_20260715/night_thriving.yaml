# Abundance test — does Sovereign/Hub emerge without scarcity pressure?
# Pair-invest is strongly positive-sum (+10pp); decay minimal (2%).
# Expected system growth: ~+8% per round under mutual cooperation.
# Compare vs mafia (break-even) and extreme (negative-sum).

num_agents: 30
initial_resources: 100.0

# Invest — strongly positive-sum (+10pp margin per pair)
c_inv: 0.05
g_inv: 0.15
gamma_sat: 0.80
tau_sat: 5

# Arming
c_arm: 0.10
mu_arm: 3.0
delta_B: 0.50

# Combat — moderate (same as mafia)
alpha: 0.30
c_atk: 0.02
eta_atk: 1.2
tau_atk: 5

# Economy — minimal decay (2% per round)
delta_R: 0.98

max_rounds: 30
history_length: 10

network_enabled: true
mean_degree: 5.0
rewiring_prob: 0.3

comm_scope: "choice"

memory:
  enabled: true
  window_size: 10
