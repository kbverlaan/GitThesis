# Game Parameters
# Adjust these to tune the "interesting phase space"

# Agent Configuration
num_agents: 30
initial_resources: 25.0

# Investment Parameters
invest_self_cost: 0       # Cost to invest in yourself
invest_self_return: 2     # Return from self-investment

invest_other_cost: 0
invest_other_return: 5    # Return for target from other-investment

# Military Parameters
arm_cost: 0.0           # D - cost to arm
arm_multiplier: 2.0      # M - power multiplier when armed (arm_self)
arm_duration: 3          # rounds that arm_self effect lasts
arm_other_contribution: 0.5  # portion of arming agent's resources added to target
arm_other_duration: 3    # rounds that arm_other contribution lasts

# Combat Parameters
attack_take_percent: 40.0
conflict_cost: 0.0         # C - cost paid by all combatants

# Game Length
max_rounds: 10
history_length: 10        # Number of rounds of history agents can see

# Action Restrictions
allow_invest_self: false  # Whether agents can use invest_self action

# Distribution
initial_distribution: "equal"

# Action Order
action_order: "simultaneous"

# Spatial Field
spatial_enabled: true
# grid_size: auto  # defaults to ceil(sqrt(num_agents * 4))
interaction_radius: 2

# Agent Memory
memory:
  enabled: true
  window_size: 10      # own action history length
