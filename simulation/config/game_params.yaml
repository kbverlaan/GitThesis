# Game Parameters — unified with prompt (see prompts.py _format_actions)
# All costs/returns are percentages of the acting agent's current resources.

# Agent Configuration
num_agents: 30
initial_resources: 25.0

# Investment Parameters (% of actor's resources)
invest_self_cost_pct: 10      # You pay 10% of your resources
invest_self_return_pct: 20    # You gain 20% (net +10%)
invest_other_cost_pct: 10     # You pay 10% of your resources
invest_other_return_pct: 15    # Target gains 15% of your resources

# Military Parameters (% of actor's resources)
arm_cost_pct: 10              # Spent amount becomes combat bonus (additive)
arm_decay: 0.5                # Bonus halves each round (×0.5)

# Combat Parameters
attack_take_pct: 40           # Winner takes 40% of loser's resources
conflict_cost_pct: 5          # Each fighter pays 5% of own resources

# Game Length
max_rounds: 50
history_length: 10            # Number of rounds of history agents can see

# Action Restrictions
allow_invest_self: false      # invest_self OFF — forces social dilemma

# Distribution
initial_distribution: "equal"

# Action Order
action_order: "simultaneous"

# Spatial Field
spatial_enabled: true
# grid_size: auto  # defaults to ceil(sqrt(num_agents * 4))
interaction_radius: 2

# Agent Memory
memory:
  enabled: true
  window_size: 10
