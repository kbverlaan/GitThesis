# Game Parameters — symbols match §3.1 of thesis.
# All proportional values are fractions in [0, 1]; multipliers are scalars;
# windows are integer rounds.

# Agents
num_agents: 30
initial_resources: 100.0

# Investment
c_inv: 0.10                          # invest cost (fraction of actor's R)
g_inv: 0.15                          # invest return (fraction of actor's R transferred)
gamma_sat: 0.80                      # saturation factor per repeat in window
tau_sat: 5                           # saturation window (rounds)

# Arming
arm_enabled: true                    # L2 rung flag: strengthen/arming affordance. When false,
                                     # strengthen is a no-op and the prompt drops every arm reference
                                     # (combat strength = resources only). Default true = legacy behaviour
                                     # (arming keyed off mu_arm>0).
c_arm: 0.05                          # arm cost (fraction of actor's R) — Koen 2026-06-21: 5%
mu_arm: 3.0                          # arm multiplier (bonus = cost × mu_arm)
delta_B: 0.50                        # arm decay factor

# Combat
take_enabled: true                   # L2 rung flag: take/combat affordance. When false, any attack is
                                     # neutralised to a no-op and the prompt drops the COMBAT block.
alpha: 0.35                          # spoils = alpha × loser's R (Koen 2026-06-21: fixed at 0.35, as VSC run)
c_atk: 0.02                          # FLAT conflict cost (fraction of own R) — Koen 2026-06-21: 2%, no escalation.
                                     # eta_atk/tau_atk (attack-cost escalation) removed from prod; engine keeps
                                     # them as default-off capability (eta=1.0 → flat), like lethal_pot.
symmetric_stakes: true               # pot = alpha × defender in BOTH win-branches (Koen 2026-06-21):
                                     # capped stakes so targets are bled, not one-shot killed → institutions
                                     # get time to form. Avoids premature mutual annihilation.
lethal_pot: false                    # capability flag (OFF in prod). If true: phi = min(1, alpha·S_win/S_lose),
                                     # loser-sized → a coalition ≥ (1/alpha)× the defender KILLS. For lethality probes only.

# Commons (T5 rung — tragedy of the commons; OFF by default, flag-gated)
commons_enabled: false               # turn on the shared-stock rung (GovSim-style doubling)
commons_K: 120.0                     # carrying capacity (absolute, HIDDEN — agents see stock as % of K).
                                     # per-capita sustainable harvest = K/(2n) = 2 units at n=30 = 2% of initial 100 R.
                                     # Calibrated vs decay: covering 3% decay needs ~3% harvest > 2% sustainable
                                     # → beating decay shrinks the pot (Ostrom temptation). Gap widens as R grows.
commons_init: null                   # initial stock (null = start full at K)
commons_harvest_pct: [0, 1, 2, 4, 8] # harvest categories as % of K (scale-invariant); sustainable p.p. ≈ 1.67%
commons_collapse_frac: 0.05          # stock collapses permanently below this fraction of K (GovSim C = 5%)
commons_harvest_mode: "category"     # "category" = GovSim categories above (default); "fraction_own" =
                                     # continuous, unbounded harvest = chosen percent of agent's OWN resources

# Economy
delta_R: 0.97                        # BASE resource decay (all rungs): R(t+1) = delta_R·(R(t) + ΔR).
                                     # 3%/round survival pressure → covering it needs ~3.09% harvest.
                                     # No self-invest → survival forces social action OR the commons
                                     # (reinforces "order is inherently social"). 1.0 = no-decay legacy.

# Game length
max_rounds: 30                       # BASIS (Koen 2026-06-21: budget is afgestemd op R30).
                                     # Verlenging voor de top-down-norm long-run-probe: 60 of 100 rondes
                                     # (vereist langere context — zie max-model-len 65536).
history_length: 10

# Network
network_enabled: true                # static topology = always-on substrate (transfer/take/strengthen
                                     # are 1-hop). Present on EVERY rung; do not gate it by a rung flag.
assoc_enabled: true                  # L3 rung flag: association = drop/invite rewiring. When false, no
                                     # rewiring happens and the prompt drops every drop/invite reference
                                     # (the topology is frozen). Default true = legacy behaviour
                                     # (rewiring keyed off rewiring_prob>0).
mean_degree: 5.0
rewiring_prob: 0.0                   # w — IV (§3.3.2)

# Communication
comm_scope: "none"                   # "none" = off; any other value = on.
                                     # When on: one message/round to a LIST of target ids
                                     # (message_to), free addressing to agents you know of,
                                     # no broadcast channel. Legacy dm/broadcast/choice → on.

# Memory (two layers: raw events on a recency window + agent notes)
memory:
  enabled: true
  window_size: 10          # raw events (actions, messages, network, resources): last k rounds
  notes_persist: true      # agent's own notes kept for the WHOLE game (false = windowed, legacy)
