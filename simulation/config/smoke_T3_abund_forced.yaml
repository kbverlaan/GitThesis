# SMOKE — T3 abundance FORCED SOCIALITY (2026-07-16): gamma_sat 0.80 (was 1.00).
# = probe_C_memneutral.yaml (zelfde seed 3410631900 = zelfde wereld als de
# Order 1-gilde-run) met één regel anders: concentratie op vaste paren wordt
# gestraft, rotatie/invite wordt noodzaak. Exploratory appendix-kandidaat.
# NIET registered — beslis-input forced-sociality-appendix (checklist).
#
# Flag matrix (see ladder_L1.yaml header).

num_agents: 30
initial_resources: 100.0

# Investment
c_inv: 0.06
g_inv: 0.142
gamma_sat: 0.80                      # FORCED SOCIALITY: zelfde-paar-rendement decayt 0.8^prior (venster tau_sat)
tau_sat: 5

# Arming — ON
arm_enabled: true
c_arm: 0.05
mu_arm: 4.0
delta_B: 0.75

# Combat — ON
take_enabled: true
alpha: 0.35
c_atk: 0.02
symmetric_stakes: true
lethal_pot: false

# Commons — OFF on L3
commons_enabled: false
commons_K: 120.0
commons_init: null
commons_collapse_frac: 0.05
commons_open_round: 2                 # inert zolang commons_enabled false (parity met L4)

# Economy
delta_R: 0.97

# Game length
max_rounds: 60
history_length: 10

# Network — association (rewiring) ON from L3; w>0 gives it bite
network_enabled: true
assoc_enabled: true
mean_degree: 5.0
rewiring_prob: 1.0                    # actie = zekere uitkomst (productie, 2026-07-14)

# Communication — ON (base substrate)
comm_scope: "choice"

# Memory — ON (base substrate)
memory:
  enabled: true
  window_size: 10
  notes_persist: true

# Zelfde seed als de originele C-run (rewactC): identieke agent-namen en
# starttopologie, zodat het memory-instructie-verschil zo zuiver mogelijk
# vergelijkt (LLM-stochasticiteit bij temp 0.3 blijft).
random_seed: 3410631900
