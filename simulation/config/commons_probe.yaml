# Commons probe — T5 rung (tragedy of the commons, GovSim-style) ON.
# Top of the ladder: all lower affordances + language; governance must emerge
# from messaging (no built-in vote/quota/sanction). Standalone game_params.

# Agents
num_agents: 30
initial_resources: 100.0

# Investment
c_inv: 0.10
g_inv: 0.15
gamma_sat: 0.80
tau_sat: 5

# Arming
c_arm: 0.05
mu_arm: 3.0
delta_B: 0.50

# Combat (prod: symmetric capped stakes, no one-shot kill; flat conflict cost)
alpha: 0.35
c_atk: 0.02
symmetric_stakes: true
lethal_pot: false

# Commons (T5 rung — ON for this probe)
commons_enabled: true
commons_K: 120.0                     # hidden capacity; per-capita sustainable = K/(2n) = 2 = 2% init R (vs 3% decay)
commons_init: null                   # start full at K
commons_harvest_pct: [0, 1, 2, 4, 8] # % of K; sustainable p.p. ≈ 1.67% (between cat 2 and 4)
commons_collapse_frac: 0.05          # permanent collapse below 5% of K (GovSim C=5)

# Economy
delta_R: 0.97

# Game length
max_rounds: 30
history_length: 10

# Network
network_enabled: true
mean_degree: 5.0
rewiring_prob: 0.0

# Communication — ON (governance must emerge from language)
comm_scope: "choice"

# Memory
memory:
  enabled: true
  window_size: 10
  notes_persist: true
