# LLM API Configuration
# Supports OpenRouter (cloud) and vLLM (local/Snellius)

# --- Backend selection ---
# OpenRouter (default):
#   base_url: "https://openrouter.ai/api/v1"
#   api_key_env_var: "OPENROUTER_API_KEY"
#   model: "google/gemini-2.5-flash-lite"
#
# Local vLLM:
#   base_url: "http://localhost:8000/v1"
#   api_key_env_var: ""  # not needed
#   model: "meta-llama/Llama-3.1-8B-Instruct"
#
# Snellius vLLM:
#   base_url: "http://<node>:8000/v1"  # set by SLURM job
#   api_key_env_var: ""
#   model: "meta-llama/Llama-3.1-8B-Instruct"

# API Settings
api_key_env_var: "OPENROUTER_API_KEY"
base_url: "https://openrouter.ai/api/v1"

# Model Selection
model: "google/gemini-2.5-flash-lite"

# Generation Parameters
temperature: 0.7
max_tokens: 500
timeout: 30  # seconds

# Rate Limiting
requests_per_minute: 30
retry_attempts: 3
retry_delay: 2  # seconds

# Prompt Configuration - Unified Toggles
prompt_config:
  objective_style: "maximize_resources"
  state_style: "descriptive"            # Options: 'minimal', 'descriptive'
  history_style: "descriptive"          # Options: 'minimal', 'descriptive'
  action_style: "descriptive"           # Options: 'minimal', 'descriptive'
  show_effects: false                    # Show numerical costs/returns in actions
  social_cot: true                     # Enable social chain of thought prompting
  information_level: "full"             # Options: 'full' (show all info)
