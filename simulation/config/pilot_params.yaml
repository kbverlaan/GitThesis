# Pilot run — 30 agents × 30 rounds with emergence-friendly IVs.
# Goal: exercise prompt harness end-to-end, inspect memory/event logs,
# check whether the four substantive features (ToM, messages, rewiring,
# coalitions) all surface in one run before launching the factorial.

# Agents — small for bugfix-iteration pilot
num_agents: 5
initial_resources: 100.0

# Investment
c_inv: 0.10
g_inv: 0.15
gamma_sat: 0.80
tau_sat: 5

# Arming
c_arm: 0.10
mu_arm: 3.0
delta_B: 0.50

# Combat
alpha: 0.20
c_atk: 0.01
eta_atk: 1.2
tau_atk: 5

# Economy
delta_R: 0.95

# Game length — short for bugfix-iteration pilot
max_rounds: 10
history_length: 10

# Network — fluid (w=0.3), lets agents escape threats and form alliances
network_enabled: true
mean_degree: 5.0
rewiring_prob: 0.3

# Communication — DM enables private coordination, coalition-building
comm_scope: "dm"

# Memory
memory:
  enabled: true
  window_size: 10
