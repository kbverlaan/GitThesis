# A/B-PROBE rewire-mode — arm B PRIME: REWIRE-ALS-ACTIE + prob 1.0 (actie = zekere uitkomst), L3 bistable, 25 rondes.
# Affordances: L2 + drop/invite (network rewiring). No commons.
# Comms + memory ON (always-on base substrate). Prod numeric params unchanged.
# rewiring_prob > 0 so association actually has bite (w=0.5).
#
# Flag matrix (see ladder_L1.yaml header).

num_agents: 30
initial_resources: 100.0

# Investment
c_inv: 0.06
g_inv: 0.091
gamma_sat: 1.00
tau_sat: 5

# Arming — ON
arm_enabled: true
c_arm: 0.05
mu_arm: 4.0
delta_B: 0.75

# Combat — ON
take_enabled: true
alpha: 0.35
c_atk: 0.02
symmetric_stakes: true
lethal_pot: false

# Commons — OFF on L3
commons_enabled: false
commons_K: 120.0
commons_init: null
commons_harvest_pct: [0, 1, 2, 4, 8]
commons_collapse_frac: 0.05

# Economy
delta_R: 0.97

# Game length
max_rounds: 25
history_length: 10

# Network — association (rewiring) ON from L3; w>0 gives it bite
network_enabled: true
assoc_enabled: true
mean_degree: 5.0
rewiring_prob: 1.0

# Communication — ON (base substrate)
comm_scope: "choice"

# Memory — ON (base substrate)
memory:
  enabled: true
  window_size: 10
  notes_persist: true

# drop/invite zijn ACTIES (mutually exclusive met transfer/strengthen/take/hold);
# nominatie via action+target, geen aparte schema-velden. Zelfde rewiring_prob.
assoc_rewire_mode: "action"
