# vLLM on Snellius — main runner backend. No API key needed.

api_key_env_var: ""
base_url: "http://localhost:8000/v1"

model: "/scratch-shared/kverlaan/origins_models/Qwen3.5-27B"

temperature: 0.3
max_tokens: 16000       # thinking-CoT groeit naar 8K+ bij vol window; 8000 gaf truncatie+retries (OpenRouter-lab 2026-07-10)
timeout: 900              # thinking models: ~6K tokens @ 30 tok/s + overhead
retry_attempts: 3
retry_delay: 5

prompt_config:
  tom_level: "level0"
