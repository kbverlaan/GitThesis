# Overnight solo-run: 30 agents × 30 rounds, L3 ToM + choice scope + fluid rewiring.

# Agents
num_agents: 30
initial_resources: 100.0

# Investment
c_inv: 0.10
g_inv: 0.15
gamma_sat: 0.80
tau_sat: 5

# Arming
c_arm: 0.10
mu_arm: 3.0
delta_B: 0.50

# Combat
alpha: 0.20
c_atk: 0.01
eta_atk: 1.2
tau_atk: 5

# Economy
delta_R: 0.95

# Game length
max_rounds: 30
history_length: 10

# Network — fluid
network_enabled: true
mean_degree: 5.0
rewiring_prob: 0.3

# Communication — agent-choice between DM and broadcast per round
comm_scope: "choice"

# Memory
memory:
  enabled: true
  window_size: 10
