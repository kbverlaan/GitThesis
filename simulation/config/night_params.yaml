# Overnight solo-run: 30 agents × 30 rounds, maximaal interessant cell
# voor emergence (L2 ToM + DM + fluid rewiring).
# Estimated: 60-120 min wallclock on OpenRouter, ~$1.50-3 in tokens.

# Agents
num_agents: 30
initial_resources: 100.0

# Investment
c_inv: 0.10
g_inv: 0.15
gamma_sat: 0.80
tau_sat: 5

# Arming
c_arm: 0.10
mu_arm: 3.0
delta_B: 0.50

# Combat
alpha: 0.20
c_atk: 0.01
eta_atk: 1.2
tau_atk: 5

# Economy
delta_R: 0.95

# Game length
max_rounds: 30
history_length: 10

# Network — fluid
network_enabled: true
mean_degree: 5.0
rewiring_prob: 0.3

# Communication — DM enables coordination
comm_scope: "dm"

# Memory
memory:
  enabled: true
  window_size: 10
