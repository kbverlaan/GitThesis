# Complexity ladder — RUNG 2: Predation + arming.
# Affordances: L1 + take + strengthen (arming). No rewiring, no commons.
# Comms + memory ON (always-on base substrate). Prod numeric params unchanged.
#
# Flag matrix (see ladder_L1.yaml header).

num_agents: 30
initial_resources: 100.0

# Investment
c_inv: 0.10
g_inv: 0.15
gamma_sat: 0.80
tau_sat: 5

# Arming — ON from L2
arm_enabled: true
c_arm: 0.05
mu_arm: 3.0
delta_B: 0.50

# Combat — ON from L2
take_enabled: true
alpha: 0.35
c_atk: 0.02
symmetric_stakes: true
lethal_pot: false

# Commons — OFF on L2
commons_enabled: false
commons_K: 600.0
commons_init: null
commons_harvest_pct: [0, 1, 2, 4, 8]
commons_collapse_frac: 0.05

# Economy
delta_R: 1.0

# Game length
max_rounds: 30
history_length: 10

# Network — static topology always on; association (rewiring) OFF on L2
network_enabled: true
assoc_enabled: false
mean_degree: 5.0
rewiring_prob: 0.0

# Communication — ON (base substrate)
comm_scope: "choice"

# Memory — ON (base substrate)
memory:
  enabled: true
  window_size: 10
  notes_persist: true
