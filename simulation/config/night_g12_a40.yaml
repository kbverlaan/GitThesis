# Moderate phase-probe: halved invest magnitude (5%/7%), very slow decay (2%),
# 2x predation reward, 5x attack cost, fluid preferential rewiring (w=0.8).
# L3 + choice + memory w=10 held constant vs extreme run.

num_agents: 30
initial_resources: 100.0

# Investment — halved magnitude, same +2pp margin (net positive-sum)
c_inv: 0.05
g_inv: 0.07
gamma_sat: 0.80
tau_sat: 5

# Arming
c_arm: 0.10
mu_arm: 3.0
delta_B: 0.50

# Combat — 2x baseline predation reward, 5x baseline attack cost
alpha: 0.40
c_atk: 0.05
eta_atk: 1.2
tau_atk: 5

# Economy — very slow decay (2% per round)
delta_R: 0.98

max_rounds: 30
history_length: 10

network_enabled: true
mean_degree: 5.0
rewiring_prob: 0.8

comm_scope: "choice"

memory:
  enabled: true
  window_size: 10
