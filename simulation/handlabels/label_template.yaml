# Hand-label-template — IRR-validatie order-ladder gate (fixplan Fase 3).
#
# KOEN: vul per run 'label:' in met het orde-type dat JIJ de run geeft op
# basis van de narratieven/traces (niet op basis van de gate-output — blind
# labelen, anders is de kappa circulair). Kies uit:
#   coordination | cooperation | convention | norm | institution | governance
# 'skip' = niet labelen. 'note:' vrij veld.
#
# Stratificatie: 5 rewire-probes (bekende narratieven) + 5 prod-proofs (alle
# rungs, kort) + 2 nieuwe smokes zodra klaar. Aanvullen met grid-runs kan later
# (zelfde formaat), maar de FREEZE moet vóór de confirmatory-analyse.
#
# Daarna: python3 scripts/irr_check.py handlabels/labels.yaml
# (kopieer dit bestand naar labels.yaml zodat het template schoon blijft)

