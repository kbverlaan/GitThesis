name: qwen_l3_rerun_invest_return
description: "L3 rerun with 20 rounds — invest_other_return_pct=25, longer time for stabilisation"
reps: 2
api_config: vllm_config.yaml
base_params:
  num_agents: 10
  initial_resources: 25.0
  invest_self_cost_pct: 10
  invest_self_return_pct: 12
  invest_other_cost_pct: 10
  invest_other_return_pct: 25
  arm_cost_pct: 10
  arm_decay: 0.5
  attack_take_pct: 40
  conflict_cost_pct: 5
  max_rounds: 20
  history_length: 10
  allow_invest_self: false
  initial_distribution: "equal"
  action_order: "simultaneous"
  spatial_enabled: true
  interaction_radius: 2
sweep:
  grid:
    - param: "reasoning_level"
      target: "prompt_config"
      values: ["level3"]
# 1 condition x 2 reps = 2 runs
# L3 only — L1 results already complete (100% do_nothing)
# 20 rounds to allow dynamics to stabilise or escalate
