# vLLM Configuration for FP8 model on port 8199
# Identical to vllm_config.yaml except model path and port

api_key_env_var: ""
base_url: "http://localhost:8199/v1"

model: "/scratch-shared/kverlaan/origins_models/Qwen3.5-27B-FP8"

temperature: 0.7
max_tokens: 8000
timeout: 900

requests_per_minute: 1000
retry_attempts: 3
retry_delay: 5

prompt_config:
  objective_style: "maximize_resources"
  state_style: "descriptive"
  history_style: "descriptive"
  action_style: "descriptive"
  show_effects: false
  social_cot: true
  information_level: "full"
