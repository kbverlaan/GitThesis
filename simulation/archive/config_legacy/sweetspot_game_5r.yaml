# Emergence run — 10 agents, 30 rounds, diminishing returns on repeated investment
num_agents: 10
initial_resources: 25.0

invest_self_pct: 0.5
invest_other_cost_pct: 10
invest_other_return_pct: 15
invest_saturation_decay: 0.8
invest_saturation_window: 5
allow_invest_self: false

arm_cost_pct: 10
arm_multiplier: 3.0
arm_decay: 0.5

attack_take_pct: 50
conflict_cost_pct: 1
resource_decay_pct: 5

max_rounds: 40
history_length: 10

action_order: "simultaneous"

network_enabled: true
mean_degree: 3.0
rewiring_prob: 0.1
payoff_window: 3

comm_scope: "dm"

memory:
  enabled: true
  window_size: 10

note_to_self: true
