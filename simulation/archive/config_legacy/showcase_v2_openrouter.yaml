# OpenRouter API config for showcase v2
# Qwen 3.5-27B thinking model — needs high max_tokens for reasoning chain

api_key_env_var: "OPENROUTER_API_KEY"
base_url: "https://openrouter.ai/api/v1"

model: "qwen/qwen3.5-27b"

temperature: 0.7
max_tokens: 16384              # Thinking models need room for reasoning + JSON
timeout: 120
requests_per_minute: 20
retry_attempts: 3
retry_delay: 3

prompt_config:
  objective_style: "maximize_resources"
  hide_resources: false
  reasoning_level: "level3"
