# OpenRouter config for sweetspot sanity runs
# Qwen 3.5-27B needs room for <think> + JSON

api_key_env_var: "OPENROUTER_API_KEY"
base_url: "https://openrouter.ai/api/v1"

model: "qwen/qwen3.5-27b"

temperature: 0.7
max_tokens: 4096
timeout: 120
requests_per_minute: 20
retry_attempts: 2
retry_delay: 3

prompt_config:
  objective_style: "maximize_resources"
  hide_resources: false
  reasoning_level: "level3"
