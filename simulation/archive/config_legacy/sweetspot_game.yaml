# Sweet spot game parameters — balanced arm/invest/attack dynamics
# arm+attack EV ≈ 0 vs equal (genuine dilemma), invest_other dominates with trust
# See analysis: m=3 d=0.5 → attack barely +EV, invest wins after ~12 rounds

# Agent Configuration
num_agents: 5
initial_resources: 25.0

# Investment Parameters (% of actor's resources)
invest_self_pct: 1              # Safe fallback: +1%/round, no risk
invest_other_cost_pct: 10       # You pay 10%
invest_other_return_pct: 15     # Target gets 15% — cooperation surplus +5%
allow_invest_self: true         # ON — safe fallback when trust is low

# Military Parameters (% of actor's resources)
arm_cost_pct: 10
arm_multiplier: 3.0             # Sweet spot: +30% combat bonus
arm_decay: 0.5                  # Fades in ~3 rounds — vulnerability windows

# Combat Parameters
attack_take_pct: 25             # Winner takes 25% of loser — recoverable setback
conflict_cost_pct: 5            # Both pay 5%

# Game Length
max_rounds: 20
history_length: 10

# Action Restrictions
action_order: "simultaneous"

# Network Topology
network_enabled: true
mean_degree: 3.0
rewiring_prob: 0.3
payoff_window: 3

# Communication
comm_scope: "dm"                # Private messages — enables coordination

# Agent Memory
memory:
  enabled: true
  window_size: 10

# Note-to-self: agents can write a private strategic note persisted across rounds
note_to_self: true
