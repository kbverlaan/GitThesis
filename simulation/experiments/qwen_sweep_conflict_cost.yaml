name: qwen_sweep_conflict_cost
description: "Qwen 3.5 screening: conflict_cost_pct x reasoning — theta for combat"
reps: 2
api_config: vllm_config.yaml
base_params:
  num_agents: 10
  initial_resources: 25.0
  invest_self_cost_pct: 10
  invest_self_return_pct: 12
  invest_other_cost_pct: 10
  invest_other_return_pct: 15
  arm_cost_pct: 10
  arm_decay: 0.5
  attack_take_pct: 40
  conflict_cost_pct: 5
  max_rounds: 10
  history_length: 10
  allow_invest_self: true
  initial_distribution: "equal"
  action_order: "simultaneous"
  spatial_enabled: true
  interaction_radius: 2
sweep:
  grid:
    - param: "conflict_cost_pct"
      target: "game_params"
      values: [0, 5, 10, 20]
    - param: "reasoning_level"
      target: "prompt_config"
      values: ["level1", "level3"]
# 4 x 2 = 8 conditions x 2 reps = 16 runs
