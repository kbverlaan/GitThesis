name: qwen_sweep_invest_return
description: "Qwen 3.5 screening: invest_other_return_pct x reasoning"
reps: 2
api_config: vllm_config.yaml
base_params:
  num_agents: 10
  initial_resources: 25.0
  invest_self_cost_pct: 10
  invest_self_return_pct: 12
  invest_other_cost_pct: 10
  invest_other_return_pct: 15
  arm_cost_pct: 10
  arm_decay: 0.5
  attack_take_pct: 40
  conflict_cost_pct: 5
  max_rounds: 10
  history_length: 10
  allow_invest_self: true
  initial_distribution: "equal"
  action_order: "simultaneous"
  spatial_enabled: true
  interaction_radius: 2
sweep:
  grid:
    - param: "invest_other_return_pct"
      target: "game_params"
      values: [10, 15, 25]
    - param: "reasoning_level"
      target: "prompt_config"
      values: ["level1", "level3"]
# 3 x 2 = 6 conditions x 2 reps = 12 runs
# 10% = break even (cost=return), 15% = moderate surplus, 25% = high surplus
