name: max_emergence_exploratory
description: >
  Proof of concept: can the engine produce rich social dynamics?
  Tuned for maximum emergence — hegemons, overthrows, coalitions, betrayal.
  Hidden resources + L3 reasoning + high cooperation surplus + cheap attacks.
  NOT for publication — exploratory only.

reps: 3
api_config: openrouter_config.yaml

base_params:
  # Scale (small for OR cost)
  num_agents: 10
  initial_resources: 25.0

  # Cooperation: lucratief maar eenzijdig (surplus ratio 2.5x)
  invest_self_pct: 1              # Almost nothing — forces social interaction
  invest_other_cost_pct: 10       # You pay 10%
  invest_other_return_pct: 25     # Target gets 25% — high social surplus
  allow_invest_self: true         # ON but nearly useless at 1%

  # Military: duur maar krachtig
  arm_cost_pct: 10
  arm_multiplier: 2.0             # +20% combat bonus
  arm_decay: 0.5                  # Halves each round

  # Combat: winstgevend, lage kosten → creates hegemon dynamics
  attack_take_pct: 50             # Winner takes 50% of loser
  conflict_cost_pct: 5            # Both pay only 5%

  # Structure
  max_rounds: 30
  history_length: 10
  initial_distribution: "equal"
  action_order: "simultaneous"

  # Spatial: local clusters
  spatial_enabled: true
  interaction_radius: 2

  # Memory ON (standaard, geen IV)
  memory:
    enabled: true
    window_size: 10

sweep:
  grid:
    - param: "reasoning_level"
      target: "prompt_config"
      values: ["level3"]
    - param: "hide_resources"
      target: "prompt_config"
      values: [true]

# 1 condition x 3 reps = 3 runs
# Estimated cost: ~$0.30-0.50 per run on OR (10 agents, 30 rounds)
# Total: ~$1-1.50
#
# What to look for in results:
# - Gini trajectory: does inequality emerge and change over time?
# - Action distribution: do we see phases (cooperation → arming → conflict)?
# - Network: do communities form? Do they have internal cooperation + external conflict?
# - Hierarchy: do Elo ratings diverge? Is there a hegemon?
# - Overthrows: does a hegemon get attacked by a coalition?
# - E-I index: is attack outgroup-directed, cooperation ingroup-directed?
