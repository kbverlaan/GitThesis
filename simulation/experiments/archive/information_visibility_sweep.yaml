name: information_visibility_sweep
description: "Origins Exp 1c: How does information availability affect social order?"
reps: 20
base_params:
  num_agents: 10
  initial_resources: 25.0
  invest_self_cost: 0
  invest_self_return: 2
  invest_other_cost: 0
  invest_other_return: 5
  arm_cost: 0.0
  arm_multiplier: 2.0
  arm_duration: 3
  arm_other_contribution: 0.5
  arm_other_duration: 3
  attack_take_percent: 40.0
  conflict_cost: 0.0
  max_rounds: 50
  history_length: 10
  allow_invest_self: false
  initial_distribution: "equal"
  action_order: "simultaneous"
  spatial_enabled: true
  interaction_radius: 2
sweep:
  grid:
    - param: "hide_resources"
      target: "prompt_config"
      values: [false, true]
    - param: "show_reputation"
      target: "prompt_config"
      values: [false, true]
    - param: "history_length"
      target: "game_params"
      values: [0, 10]
