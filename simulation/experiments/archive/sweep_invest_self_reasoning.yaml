name: sweep_invest_self_reasoning
description: "System characterization: invest_self on/off x reasoning depth"
reps: 3
api_config: vllm_config.yaml
base_params:
  num_agents: 30
  initial_resources: 25.0
  invest_self_cost: 0
  invest_self_return: 2
  invest_other_cost: 0
  invest_other_return: 5
  arm_cost: 0.0
  arm_multiplier: 2.0
  arm_duration: 3
  arm_other_contribution: 0.5
  arm_other_duration: 3
  attack_take_percent: 40.0
  conflict_cost: 0.0
  max_rounds: 50
  history_length: 10
  allow_invest_self: false
  initial_distribution: "equal"
  action_order: "simultaneous"
  spatial_enabled: true
  interaction_radius: 2
sweep:
  grid:
    - param: "model"
      target: "openrouter"
      values:
        - "/scratch-shared/kverlaan/origins_models/gemma-2-27b-it"
    - param: "allow_invest_self"
      target: "game_params"
      values: [true, false]
    - param: "reasoning_level"
      target: "prompt_config"
      values: ["level0", "level1", "level2", "level3"]
