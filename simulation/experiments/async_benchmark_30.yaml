# Benchmark: async scheduling test for 30-agent parallel runs
# Compare: 1x (baseline, no-async) vs 2x parallel (async enabled)
#
# Condition A (1x baseline — already measured: ~4 min/round)
# Condition B (2x async):
#   sbatch --gpus-per-node=1 snellius/parallel_runs_async.sh \
#     /scratch-shared/kverlaan/origins_models/Qwen3.5-27B experiments/async_benchmark_30.yaml 2

name: async_benchmark_30
description: "Async scheduling benchmark: 2x parallel with continuous batching"
reps: 3
api_config: vllm_config.yaml
base_params:
  num_agents: 30
  initial_resources: 25.0
  allow_invest_self: false
  invest_other_cost_pct: 8
  invest_other_return_pct: 15
  arm_cost_pct: 10
  arm_multiplier: 3.0
  arm_decay: 0.5
  attack_take_pct: 50
  combat_max_loss_pct: 75
  conflict_cost_pct: 1
  resource_decay_pct: 5
  invest_saturation_decay: 0.8
  invest_saturation_window: 5
  max_rounds: 5
  history_length: 10
  action_order: "simultaneous"

  network_enabled: true
  mean_degree: 4.0
  rewiring_prob: 0.3
  payoff_window: 3

  comm_scope: "dm"

  memory:
    enabled: true
    window_size: 10
  note_to_self: true

sweep:
  param: "reasoning_level"
  target: "prompt_config"
  values: ["level2"]
# 1 condition × 3 reps = 3 runs (enough for PARALLEL=2 or 3)
